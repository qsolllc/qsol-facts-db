name: QSol CI/CD Release Pipeline

on:
  push:
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  test-python:
    name: Python Gate (16 Green Tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest tests -v

  build-rust:
    name: Cross-Compile Rust Core (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Rust Binary
        working-directory: ./facts_db_rs
        run: |
          cargo build --release --target ${{ matrix.rust_target }}

      - name: Upload Rust Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: facts-db-rs-${{ matrix.target }}
          path: facts_db_rs/target/${{ matrix.target }}/release/libfacts_db_rs.*

  build-python-wheels:
    name: Build Python Wheel & Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Distribution Packages
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-packages
          path: dist/

  release-artifacts:
    name: Publish to GitHub Release
    needs: [test-python, build-rust, build-python-wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Display Downloaded Structure
        run: ls -R

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            python-dist-packages/*
            facts-db-rs-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
